<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time zone converter</title>
    <link rel="stylesheet" href="styles.css">

    <style >

        #convertButton
        {
            background-color: rgb(255, 255, 0);
            border-radius: 10%;
            width: 300px;
            height: 40px;
            font-size: larger;
            transition: background-color 0.25s ease;
        }
        #convertButton:hover
        {
            background-color: rgb(255, 215, 0);
        }
    </style>
    
</head>
<body style="background-image: linear-gradient(rgb(255, 255, 255, 0.5), rgb(255, 255, 255, 0.5)), url(clock2.jpg); background-size: cover;">
    <h1 style="text-align: center;">Timezone Converter</h1>
    <div style="text-align: center;">
        <label for="inputTime">Select time</label><br>
        <input style="background-color: rgb(255, 215, 0);" type="datetime-local" name="" id="timeInput" value="12:00">
    </div>
    <br>

    <div style="display: flex; justify-content: center; gap: 50px;">
        <div>
            <label for="fromCity">From city</label> <br>
            <select name="" id="fromCity">
                <option value="Asia/Karachi">Asia/Karachi</option>
                <option value="Asia/Kolkata">Asia/Kolkata</option>
                <option value="Asia/Dubai">Asia/Dubai</option>
                <option value="Asia/Riyadh">Asia/Riyadh</option>
                <option value="Asia/Shanghai">Asia/Shanghai</option>
                <option value="Asia/Tokyo">Asia/Tokyo</option>
                <option value="Asia/Singapore">Asia/Singapore</option>
                <option value="Europe/London">Europe/London</option>
                <option value="Europe/Berlin">Europe/Berlin</option>
                <option value="America/New_York">America/New_York</option>
                <option value="America/Chicago">America/Chicago</option>
                <option value="America/Los_Angeles">America/Los_Angeles</option>
                <option value="Australia/Sydney">Australia/Sydney</option>
                <option value="Pacific/Auckland">Pacific/Auckland</option>
            </select>
        </div>

        <div>
            <label for="toCity">To city</label><br>
            <select name="" id="toCity">
                <option value="Asia/Karachi">Asia/Karachi</option>
                <option value="Asia/Kolkata">Asia/Kolkata</option>
                <option value="Asia/Dubai">Asia/Dubai</option>
                <option value="Asia/Riyadh">Asia/Riyadh</option>
                <option value="Asia/Shanghai">Asia/Shanghai</option>
                <option value="Asia/Tokyo">Asia/Tokyo</option>
                <option value="Asia/Singapore">Asia/Singapore</option>
                <option value="Europe/London">Europe/London</option>
                <option value="Europe/Berlin">Europe/Berlin</option>
                <option value="America/New_York">America/New_York</option>
                <option value="America/Chicago">America/Chicago</option>
                <option value="America/Los_Angeles">America/Los_Angeles</option>
                <option value="Australia/Sydney">Australia/Sydney</option>
                <option value="Pacific/Auckland">Pacific/Auckland</option>
            </select>
        </div>
    </div>
    <br>

    <div style="text-align: center;">
        <button id="convertButton"><b>convert time</b></button>        
    </div>



    <br><br><br>
    <div style="text-align: center; border: 2px solid black;">
        <h1>RESULTS</h1>

        <p id="resultText">pick a time and click convert</p>
        
    </div>


    <script src="script.js"></script>
        
</body>
</html>
